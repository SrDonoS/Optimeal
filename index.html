<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Optimeal: reserva anticipada de almuerzos escolares para cocinar las raciones justas. Planifica mejor. Desperdicia menos." />
    <meta name="theme-color" content="#FBF8F1" />
    <title>Optimeal · Planifica mejor. Desperdicia menos.</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 🛟 Aviso de emergencia: si la app ni siquiera alcanza a cargar
         (por ejemplo, si se abrió index.html con doble clic), explicamos
         qué hacer en vez de mostrar una página en blanco. -->
    <script>
      (function () {
        function avisar(detalle) {
          var root = document.getElementById('root')
          if (!root || root.hasChildNodes()) return
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;line-height:1.55;color:#1e2a23;background:#fffdf8;border:1px solid #e9e2d2;border-radius:24px">' +
            '<h1 style="font-size:22px;margin:0 0 8px">Optimeal no pudo cargar 😕</h1>' +
            '<p style="margin:0 0 12px">Abre la página con <b>npm run dev</b> en la terminal y entra a ' +
            '<b>http://localhost:5173</b> (no con doble clic en index.html).</p>' +
            (detalle ? '<pre style="white-space:pre-wrap;background:#fff;padding:12px;border-radius:12px;font-size:12px;color:#8e3128">' +
              String(detalle).replace(/</g, '&lt;') + '</pre>' : '') +
            '</div>'
        }
        if (location.protocol === 'file:') {
          document.addEventListener('DOMContentLoaded', function () { avisar('') })
        }
        window.addEventListener('error', function (e) {
          // Ignoramos imágenes u otros recursos: solo nos importan los scripts
          var t = e.target
          if (t && t !== window && t.tagName !== 'SCRIPT') return
          setTimeout(function () { avisar(e.message || 'No se pudo cargar un archivo de la app.') }, 50)
        }, true)
      })()
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
